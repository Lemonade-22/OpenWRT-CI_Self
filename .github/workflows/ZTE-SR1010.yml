name: ZTE SR1010 OWRT
run-name: ZTE SR1010 · ${{ inputs.TEST && '仅检查配置' || '完整编译' }}

on:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '调整预装包，每行 CONFIG_PACKAGE_包名=y/m/n'
        type: string
        required: false
      TEST:
        description: '仅生成并验证配置，不编译固件'
        type: boolean
        default: false
      RELEASE:
        description: '编译成功后发布到 Releases（始终保存 Artifact）'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sr1010-${{ github.ref }}
  cancel-in-progress: false

env:
  WRT_PACKAGE: ${{ inputs.PACKAGE }}
  SOURCE_REPO: https://github.com/Lemonade-22/immortalwrt.git
  SOURCE_BRANCH: sr1010-zx279133

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Same mirror workaround already available in WRT-CORE-SELF.
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' -o -name 'apt-mirrors.txt' \) \
            -exec sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
          sudo tee /etc/apt/apt.conf.d/99-sr1010-network >/dev/null <<'EOF'
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::Retries "3";
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang llvm lld flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev libelf-dev \
            libbpf-dev libclang-dev libdw-dev python3 python3-dev python3-yaml \
            python3-setuptools python3-pyelftools python3-cryptography \
            python3-packaging rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates ccache cmake ninja-build pkgconf patch perl \
            bc bzip2 cpio xz-utils zstd device-tree-compiler genisoimage qemu-utils
          sudo mkdir -p /mnt/sr1010
          sudo chown "$USER:$USER" /mnt/sr1010
          ln -s /mnt/sr1010 wrt

      - name: Clone SR1010 source
        id: source
        run: |
          git clone --depth=1 --single-branch --branch "$SOURCE_BRANCH" "$SOURCE_REPO" wrt
          echo "sha=$(git -C wrt rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Update pinned feeds
        working-directory: wrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply MT7621 software and Footstrap theme
        working-directory: wrt
        run: bash "$GITHUB_WORKSPACE/Scripts/SR1010-Prepare.sh"

      - name: Upload validated configuration
        uses: actions/upload-artifact@v4
        with:
          name: sr1010-config-${{ github.run_id }}
          path: sr1010-output/
          if-no-files-found: error

      - name: Restore compiler cache
        if: ${{ !inputs.TEST }}
        uses: actions/cache@v4
        with:
          path: wrt/.ccache
          key: sr1010-ccache-${{ runner.os }}-${{ steps.source.outputs.sha }}-${{ hashFiles('Config/ZTE-SR1010*.txt', 'Config/GENERAL.txt', 'Scripts/SR1010-Prepare.sh') }}
          restore-keys: sr1010-ccache-${{ runner.os }}-

      - name: Download source packages
        if: ${{ !inputs.TEST }}
        working-directory: wrt
        run: |
          set -o pipefail
          make download -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/download.log"

      - name: Compile firmware
        if: ${{ !inputs.TEST }}
        working-directory: wrt
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/build.log" || \
            make -j1 V=s 2>&1 | tee "$GITHUB_WORKSPACE/build-serial.log"

      - name: Verify and collect SR1010 image
        if: ${{ !inputs.TEST }}
        working-directory: wrt
        run: |
          image=bin/targets/zte/zx279133/immortalwrt-zte-zx279133-zte_zxslc-sr1010-squashfs-sysupgrade.bin
          test -s "$image"
          kernel_config=$(find build_dir/target-*/linux-zte_zx279133/linux-* -maxdepth 1 -name .config -type f)
          test -n "$kernel_config"
          for symbol in BPF BPF_SYSCALL BPF_JIT DEBUG_INFO_BTF BPF_EVENTS CGROUP_BPF COMPAT; do
            grep -qx "CONFIG_${symbol}=y" "$kernel_config"
          done
          cp "$kernel_config" "$GITHUB_WORKSPACE/sr1010-output/kernel.config"
          cp "$image" "$GITHUB_WORKSPACE/sr1010-output/"
          find bin/targets/zte/zx279133 -maxdepth 1 -type f \
            \( -name '*.manifest' -o -name '*.buildinfo' -o -name 'profiles.json' \) \
            -exec cp {} "$GITHUB_WORKSPACE/sr1010-output/" \;
          cd "$GITHUB_WORKSPACE/sr1010-output"
          sha256sum *.bin > sha256sums

      - name: Upload firmware before release
        if: ${{ !inputs.TEST }}
        uses: actions/upload-artifact@v4
        with:
          name: sr1010-firmware-${{ steps.source.outputs.date }}
          path: sr1010-output/
          if-no-files-found: error
          retention-days: 30

      - name: Publish SR1010 release
        if: ${{ !inputs.TEST && inputs.RELEASE }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sr1010-owrt-${{ steps.source.outputs.date }}
          name: ZTE SR1010 OWRT ${{ steps.source.outputs.date }}
          files: sr1010-output/*
          fail_on_unmatched_files: true
          body: |
            ZTE SR1010 / ZX279133 专属固件。
            源码：${{ env.SOURCE_REPO }}，分支：${{ env.SOURCE_BRANCH }}
            源码提交：${{ steps.source.outputs.sha }}
            CI 提交：${{ github.sha }}
            默认地址：192.168.10.1；主机名：OWRT；初始 root 密码为空。
            默认主题：Footstrap；软件选择参考 MT7621。
            增加 Samba4、mwan3 多 WAN、SyncDial 和 ZTE-MESH；启用 eBPF/BTF 与 TC BPF 模块。
            保留中兴 NPU、硬件转发和固件槽位管理。此适配不提供无线驱动。
            镜像为上游 SR1010 专用容器，内含上游修补过的 U-Boot；不适用于其他机型。
            构建产物不代表已完成实机启动验证。

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: sr1010-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            *.log
            wrt/.config
            wrt/logs/
          if-no-files-found: warn
