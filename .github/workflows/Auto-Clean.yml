name: Auto-Clean

on:
  # 每日 05:00（GMT+8）先构建两个设备，再清理前一天及更早的旧版本
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions: write-all

jobs:
  build-n60:
    name: Build N60 Pro 512m
    uses: ./.github/workflows/N60-Pro-512m.yml
    secrets: inherit

  build-xg:
    name: Build XG-040G-MD 256m
    uses: ./.github/workflows/XG-040G-MD-256m.yml
    secrets: inherit

  cleanup:
    name: Clean previous releases and workflow runs
    needs:
      - build-n60
      - build-xg
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          # 今日应保留 3 个设备版本：N60 WIFI-NO、N60 WIFI-YES、XG-040G-MD
          releases_keep_latest: 3
          delete_releases: true
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 1
