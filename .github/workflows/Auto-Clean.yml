name: Auto-Clean

on:
  # 每日 07:00（GMT+8）清理旧版本；N60 Pro 已独立于 06:00 编译
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions: write-all

jobs:
  build-xg:
    name: Build XG-040G Series
    uses: ./.github/workflows/XG-040G-Series.yml
    secrets: inherit

  cleanup:
    name: Clean previous releases and workflow runs
    needs:
      - build-xg
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          # 保留最近 3 个 Release
          releases_keep_latest: 3
          delete_releases: true
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 1
