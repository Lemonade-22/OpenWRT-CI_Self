# SPDX-License-Identifier: MIT
# RAX3000M (CMCC, SPI-NAND) 单机型 NO-WIFI：沿用 MEDIATEK-WIFI-NO 的逐个关闭写法，
# 软件侧设置与 ZN-M2 保持一致（footstrap 主题、OWRT 默认名/IP、关掉 aurora/homeproxy/samba 等）。
name: RAX3000M
run-name: 编译RAX3000M固件 · WIFI-NO · ${{ inputs.TEST && '仅输出配置' || '完整编译' }}

on:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用换行符分隔。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

permissions: write-all

jobs:
  build:
    uses: ./.github/workflows/WRT-CORE-SELF.yml
    with:
      WRT_CONFIG: RAX3000M-WIFI-NO
      WRT_THEME: footstrap
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: owrt
      WRT_SOURCE: VIKINGYFY/immortalwrt
      # Applied after GENERAL.txt. Aurora is not cloned when the theme is footstrap.
      WRT_PACKAGE: |
        ${{inputs.PACKAGE}}
        CONFIG_PACKAGE_gecoosac=n
        CONFIG_PACKAGE_luci-app-gecoosac=n
        CONFIG_PACKAGE_luci-i18n-gecoosac-zh-cn=n
        CONFIG_PACKAGE_luci-app-homeproxy=n
        CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=n
        CONFIG_PACKAGE_sing-box=n
        CONFIG_PACKAGE_luci-app-samba4=n
        CONFIG_PACKAGE_luci-i18n-samba4-zh-cn=n
        CONFIG_PACKAGE_samba4-server=n
        CONFIG_PACKAGE_samba4-libs=n
        CONFIG_PACKAGE_samba4-client=n
        CONFIG_PACKAGE_samba4-admin=n
        CONFIG_PACKAGE_samba4-utils=n
        CONFIG_PACKAGE_luci-theme-aurora=n
        CONFIG_PACKAGE_luci-app-aurora-config=n
        CONFIG_PACKAGE_luci-i18n-aurora-config-zh-cn=n
        CONFIG_PACKAGE_luci-theme-footstrap=y
      WRT_TEST: ${{inputs.TEST || false}}
