name: N60 Pro 512m

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '额外调整插件包，多个请用换行分隔。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

permissions: write-all

jobs:
  build:
    name: N60 Pro 512m WIFI-NO + WIFI-YES
    uses: ./.github/workflows/N60-Pro-512m-Core.yml
    with:
      PACKAGE: ${{ inputs.PACKAGE || '' }}
      TEST: ${{ inputs.TEST || false }}
