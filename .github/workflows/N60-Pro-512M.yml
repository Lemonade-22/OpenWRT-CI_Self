# SPDX-License-Identifier: MIT
# Netcore N60 Pro 512M NAND。
#
# 走通用 WRT 核心，不再自己抄一套步骤：主题、DAEDE、静态地址、内核兼容、
# 缓存与发布全部由 .github/workflows/WRT-CORE-SELF.yml 提供。
#
# 这台机器特殊的地方只有一处：设备树把 ubi 分区限在 122.5 MiB，认不出 512 MB NAND。
# Custom/patches/n60pro-512m-ubi-5065m.patch 扩到约 506.5 MiB，由
# Scripts/Device-Hooks/N60-Pro-512M-WIFI-{YES,NO}.sh 在 prepare 阶段打上。
name: N60 Pro 512M
run-name: ${{ inputs.FIRMWARE || '编译固件' }} · WIFI-${{ inputs.WIFI }} · ${{ inputs.TEST && '仅输出配置' || '完整编译' }}

on:
  workflow_dispatch:
    inputs:
      WIFI:
        description: 'WIFI 版本'
        type: choice
        required: true
        default: 'YES'
        options:
          - 'YES'
          - 'NO'
      PACKAGE:
        description: '手动调整插件包，多个请用换行符分隔。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

permissions: write-all

jobs:
  build:
    uses: ./.github/workflows/WRT-CORE-SELF.yml
    with:
      WRT_CONFIG: N60-Pro-512M-WIFI-${{ inputs.WIFI }}
      WRT_THEME: auto
      WRT_NAME: N60-Pro
      WRT_SSID: N60-Pro
      WRT_WORD: '12345678'
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: owrt
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: ${{ inputs.TEST || false }}
