name: N60 Pro 512M UBI-506M

on:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用换行符分隔。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

permissions: write-all


jobs:
  build:
    name: N60 Pro 512M UBI-506M WIFI-YES
    runs-on: ubuntu-24.04
    permissions: write-all
    steps:
      - uses: ./.github/actions/n60-pro-512m-core
        with:
          PACKAGE: ${{ inputs.PACKAGE || '' }}
          TEST: ${{ inputs.TEST || false }}
