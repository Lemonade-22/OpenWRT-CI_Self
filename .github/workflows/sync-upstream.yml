name: Sync upstream and build firmware

on:
  workflow_dispatch:
    inputs:
      BUILD:
        description: '同步完成后立即启动 N60 Pro / 040G 固件编译。'
        required: false
        default: true
        type: boolean
  schedule:
    # 04:00 Singapore time (UTC+8) every day.
    - cron: '0 20 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Sync VIKINGYFY OpenWRT-CI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/VIKINGYFY/OpenWRT-CI.git
          git fetch upstream main

          # Root README is an upstream-owned file: always mirror it first.
          git restore --source=upstream/main -- README.md
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m "chore: sync root README from upstream"
          fi

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream/main."
          else
            git merge --no-edit upstream/main
          fi

          git push origin HEAD:main

      - name: Start N60 Pro build after sync
        if: github.event_name == 'schedule' || inputs.BUILD == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run N60-Pro-512m.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Start 040G build after sync
        if: github.event_name == 'schedule' || inputs.BUILD == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run XG-040G-MD-256m.yml --repo "$GITHUB_REPOSITORY" --ref main
