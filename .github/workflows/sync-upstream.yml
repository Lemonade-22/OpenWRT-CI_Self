name: Sync upstream repositories

on:
  workflow_dispatch:
  schedule:
    # 每小时检查上游；GitHub 调度可能有延迟。
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Sync VIKINGYFY OpenWRT-CI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/VIKINGYFY/OpenWRT-CI.git
          git fetch upstream main

          # Root README is an upstream-owned file: always mirror it first.
          git restore --source=upstream/main -- README.md
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m "chore: sync root README from upstream"
          fi

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream/main."
          else
            if ! git merge --no-edit upstream/main; then
              git diff --name-only --diff-filter=U
              git merge --abort
              echo "::error::Upstream merge conflict; custom changes were not overwritten. Resolve the merge manually."
              exit 1
            fi
          fi

          if ! git push origin HEAD:main; then
            echo "::error::Push failed. Check concurrent changes, branch protection and workflow-file write permission. If required, configure UPSTREAM_SYNC_TOKEN as documented in Custom/Panther-X2/README.md."
            exit 1
          fi

      - name: Sync completed
        run: |
          echo "Upstream synchronization completed at $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "N60 Pro has its own scheduled build at 06:00 Beijing time."
