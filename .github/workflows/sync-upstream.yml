name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Sync VIKINGYFY OpenWRT-CI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/VIKINGYFY/OpenWRT-CI.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream/main."
          else
            git merge --no-edit upstream/main
          fi

          # Keep the repository root README identical to upstream.
          git checkout upstream/main -- README.md
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync root README from upstream"
          fi

          git push origin HEAD:main
