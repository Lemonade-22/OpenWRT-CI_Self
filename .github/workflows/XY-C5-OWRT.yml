# XiaoYu XY-C5
# Hardware: MT7621A / 512M RAM / 32M flash / 5x GbE / USB3 / SATA
# Software: VIKINGYFY immortalwrt owrt
name: XY-C5-OWRT

on:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用换行符隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

jobs:
  config:
    name: XiaoYu XY-C5 / ramips-mt7621 / OWRT
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: XY-C5-OWRT-WIFI-NO
      WRT_THEME: openwrt-2020
      WRT_NAME: XiaoYu-XY-C5
      WRT_SSID: XY-C5
      WRT_WORD: 12345678
      WRT_IP: 192.168.1.1
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: owrt
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST}}
