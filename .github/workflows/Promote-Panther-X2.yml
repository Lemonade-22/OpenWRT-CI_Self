name: Promote verified Panther X2 release
on:
  push:
    paths:
      - '.github/workflows/Promote-Panther-X2.yml'
permissions:
  contents: write
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Update verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: Panther-X2-OPhub-OWRT-2026.09.17-10.44.03
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --pattern rootfs-build.config --dir "$RUNNER_TEMP/panther-release"
          python3 - <<'PY'
          import json, os, pathlib, re
          config = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "panther-release/rootfs-build.config").read_text()
          packages = sorted(set(re.findall(r"^CONFIG_PACKAGE_(luci-(?:app|theme)[^=_]*)=y$", config, re.M)))
          assert packages, "No LuCI package list found"
          body = "\n".join([
              "源码：https://github.com/VIKINGYFY/immortalwrt.git",
              "分支：owrt",
              "提交：f2321f2de7d9ea273d7bccd90dcef436e243af54",
              "",
              "配置：Panther X2",
              "平台：armsr/armv8",
              "",
              "登录地址：192.168.10.1",
              "",
              "内核版本：6.18.51",
              "插件列表：" + " ".join(packages),
              "",
          ])
          payload = pathlib.Path(os.environ["RUNNER_TEMP"]) / "panther-release/update.json"
          payload.write_text(json.dumps({"prerelease": False, "body": body}, ensure_ascii=False), encoding="utf-8")
          PY
          gh api --method PATCH "repos/$GH_REPO/releases/390629113" --input "$RUNNER_TEMP/panther-release/update.json" --jq '{html_url, prerelease, body}'
