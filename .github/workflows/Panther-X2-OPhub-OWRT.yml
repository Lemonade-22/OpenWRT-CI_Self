# Compatibility entry; all implementation lives in the ARM64 core.
name: Panther-X2-OPhub-OWRT

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arm64-ophub-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arm64:
    uses: ./.github/workflows/ARM64-OPhub-CORE.yml
    with:
      device: panther-x2
      build: true
