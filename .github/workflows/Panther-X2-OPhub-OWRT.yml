# SPDX-License-Identifier: MIT
          CONFIG_PACKAGE_luci-app-openclash=y
# Panther X2: VIKINGYFY owrt rootfs + OPhub RK3566 hardware layer
name: Panther-X2-OPhub-OWRT

on:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: 'Additional packages; separate multiple values with newlines.'
        required: false
        type: string
      KERNEL:
        description: 'OPhub RK35xx kernel series.'
        required: false
        default: '6.18.y'
        type: choice
        options:
          - 6.12.y
          - 6.18.y

permissions:
  contents: write

env:
  SOURCE_REPO: VIKINGYFY/immortalwrt
  SOURCE_BRANCH: owrt
  OPENWRT_IP: 192.168.10.1

jobs:
  build:
    name: Panther X2 / OPhub hardware / VIKINGYFY owrt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' -o -name 'apt-mirrors.txt' \) -exec sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
          sudo tee /etc/apt/apt.conf.d/99-wrt-network >/dev/null <<'EOF'
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::Retries "3";
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget

      - name: Clone VIKINGYFY owrt source
        run: |
          git clone --depth=1 --single-branch --branch "$SOURCE_BRANCH" "https://github.com/$SOURCE_REPO.git" openwrt
          cd openwrt
          echo "SOURCE_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Configure generic arm64 rootfs
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config <<'EOF'
          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_armsr_armv8_DEVICE_generic=y
          EOF
          cat "$GITHUB_WORKSPACE/Config/GENERAL.txt" >> .config
          cat >> .config <<'EOF'
          # Keep the VIKINGYFY userspace in the OPhub image.
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl-openssl=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          EOF
          export WRT_PACKAGE="${{ inputs.PACKAGE }}"
          cd package
          bash "$GITHUB_WORKSPACE/Scripts/Packages.sh"
          bash "$GITHUB_WORKSPACE/Scripts/Handles.sh"
          cd ..
          make defconfig

      - name: Build VIKINGYFY arm64 rootfs
        run: |
          cd openwrt
          make download -j$(nproc)
          make -j$(nproc) || make -j1 V=s
          test -n "$(find bin/targets -name '*rootfs.tar.gz' -print -quit)"

      - name: Package with OPhub Panther X2 hardware layer
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/bin/targets/*/*/*rootfs.tar.gz
          openwrt_board: panther-x2
          openwrt_kernel: ${{ inputs.KERNEL }}
          auto_kernel: true
          openwrt_ip: ${{ env.OPENWRT_IP }}
          openwrt_size: 256/1024
          builder_name: Lemonade-22

      - name: Set release tag
        run: echo "RELEASE_TAG=Panther-X2-OPhub-OWRT-$(date -u +'%Y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"

      - name: Release firmware
        if: env.PACKAGED_STATUS == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.PACKAGED_OUTPUTPATH }}/*
          body: |
            Panther X2 / RK3566
            Rootfs source: ${{ env.SOURCE_REPO }} (${{ env.SOURCE_BRANCH }})
            Source commit: ${{ env.SOURCE_HASH }}
            Hardware layer: OPhub panther-x2
            Default LAN IP: ${{ env.OPENWRT_IP }}
            Default username: root
            Default password: password
