# Panther X2: native VIKINGYFY Rockchip build with the maintained OPhub DTS
name: Panther-X2-Native-OWRT

on:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: 'Additional packages; separate multiple values with newlines.'
        required: false
        type: string

permissions:
  contents: write

env:
  SOURCE_REPO: VIKINGYFY/immortalwrt
  SOURCE_BRANCH: owrt
  OPENWRT_IP: 192.168.10.1
  PANTHER_DTS_URL: https://raw.githubusercontent.com/unifreq/linux-6.18.y/a0a08476f45fb2d602fd7312def6f587f33fb91e/arch/arm64/boot/dts/rockchip/rk3566-panther-x2.dts

jobs:
  build:
    name: Panther X2 / native Rockchip / VIKINGYFY owrt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' -o -name 'apt-mirrors.txt' \) -exec sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
          sudo tee /etc/apt/apt.conf.d/99-wrt-network >/dev/null <<'EOF'
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::Retries "3";
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget

      - name: Clone VIKINGYFY owrt source
        run: |
          git clone --depth=1 --single-branch --branch "$SOURCE_BRANCH" "https://github.com/$SOURCE_REPO.git" openwrt
          cd openwrt
          echo "SOURCE_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Add Panther X2 native Rockchip target
        run: |
          cd openwrt
          cat >> target/linux/rockchip/image/armv8.mk <<'EOF'

          define Device/panther_x2
            $(Device/rk3566)
            DEVICE_VENDOR := Panther
            DEVICE_MODEL := X2
            DEVICE_DTS := rk3566-panther-x2
            # Use VIKINGYFY's existing RK3566 boot-flow while retaining the board's DTS.
            UBOOT_DEVICE_NAME := nanopi-r3s-rk3566
            DEVICE_PACKAGES := kmod-brcmfmac brcmfmac-firmware-43430b0-sdio wpad-openssl
          endef
          TARGET_DEVICES += panther_x2
          EOF

      - name: Configure native Panther X2 image
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_panther_x2=y
          CONFIG_PACKAGE_u-boot-nanopi-r3s-rk3566=y
          EOF
          cat "$GITHUB_WORKSPACE/Config/GENERAL.txt" >> .config
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          EOF
          export WRT_PACKAGE="${{ inputs.PACKAGE }}"
          cd package
          bash "$GITHUB_WORKSPACE/Scripts/Packages.sh"
          bash "$GITHUB_WORKSPACE/Scripts/Handles.sh"
          cd ..
          make defconfig

      - name: Prepare kernel with Panther X2 DTS
        run: |
          cd openwrt
          make target/linux/prepare V=s
          kernel_dir="$(find build_dir -type d -path '*linux-rockchip_armv8/linux-*' -print -quit)"
          test -n "$kernel_dir"
          dts_dir="$kernel_dir/arch/arm64/boot/dts/rockchip"
          test -d "$dts_dir"
          wget -qO "$dts_dir/rk3566-panther-x2.dts" "$PANTHER_DTS_URL"
          grep -qxF 'dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3566-panther-x2.dtb' "$dts_dir/Makefile" || echo 'dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3566-panther-x2.dtb' >> "$dts_dir/Makefile"

      - name: Build native Panther X2 firmware
        run: |
          cd openwrt
          make download -j$(nproc)
          make target/linux/compile -j$(nproc)
          make -j$(nproc) || make -j1 V=s
          test -n "$(find bin/targets/rockchip/armv8 -name '*panther-x2*sysupgrade.img.gz' -print -quit)"

      - name: Set release tag
        run: echo "RELEASE_TAG=Panther-X2-Native-OWRT-$(date -u +'%Y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"

      - name: Release firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: openwrt/bin/targets/rockchip/armv8/*panther-x2*sysupgrade.img.gz
          body: |
            Panther X2 / RK3566 native Rockchip image
            OpenWrt source: ${{ env.SOURCE_REPO }} (${{ env.SOURCE_BRANCH }})
            Source commit: ${{ env.SOURCE_HASH }}
            Hardware DTS: unifreq/linux-6.18.y @ a0a08476f45fb2d602fd7312def6f587f33fb91e
            Default LAN IP: ${{ env.OPENWRT_IP }}
            Default username: root
            Default password: password
