name: Promote existing AP8220 releases
on:
  push:
    branches: [main]
    paths: ['.github/workflows/promote-ap8220-once.yml']
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            for (const release_id of [398204137, 405826956]) {
              const {data: release} = await github.rest.repos.getRelease({...context.repo, release_id});
              if (!release.tag_name.startsWith('IPQ807X-AP8220-1G-')) throw new Error('Unexpected release');
              await github.rest.repos.updateRelease({
                ...context.repo, release_id, prerelease: false,
                body: (release.body || '').replace('AP8220 1 GiB NAND 测试版：', 'AP8220 1 GiB NAND 固件：')
              });
              core.info('Published stable: ' + release.tag_name);
            }
