# Panther X2 / RK3566
# Hardware support imported from coolsnowwolf/lede
# Software: VIKINGYFY immortalwrt owrt
name: Panther-X2-OWRT

on:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用换行符隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

jobs:
  config:
    name: Panther X2 / RK3566 / OWRT
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: Panther-X2-OWRT
      WRT_THEME: aurora
      WRT_NAME: Panther-X2
      WRT_SSID: Panther-X2
      WRT_WORD: 12345678
      WRT_IP: 192.168.1.1
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: owrt
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST}}
