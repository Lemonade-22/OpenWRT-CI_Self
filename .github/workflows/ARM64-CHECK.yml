name: ARM64 OPhub checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ARM64-*.yml'
      - 'Custom/ARM64-OPhub/**'
      - '.github/actions/arm64-ophub-validate/**'
      - 'Config/ARM64-OPhub.txt'
      - 'Config/DAEDE.txt'
      - 'Scripts/kernel_compat.py'
      - 'Custom/tests/test_kernel_compat.py'
      - 'Scripts/DAEDE.sh'
      - 'Scripts/Check-DAEDE-Kernel.py'
      - 'Custom/tests/test_arm64_*.py'
      - 'Custom/tests/test_fine3399_network.py'
  pull_request:
    paths:
      - '.github/workflows/ARM64-*.yml'
      - 'Custom/ARM64-OPhub/**'
      - '.github/actions/arm64-ophub-validate/**'
      - 'Config/ARM64-OPhub.txt'
      - 'Config/DAEDE.txt'
      - 'Scripts/kernel_compat.py'
      - 'Custom/tests/test_kernel_compat.py'
      - 'Scripts/DAEDE.sh'
      - 'Scripts/Check-DAEDE-Kernel.py'
      - 'Custom/tests/test_arm64_*.py'
      - 'Custom/tests/test_fine3399_network.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/arm64-ophub-validate
        with:
          device: all
