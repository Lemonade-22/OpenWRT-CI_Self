name: ARM64-OPhub-CORE

on:
  workflow_call:
    inputs:
      device:
        description: 'all, panther-x2 or fine3399'
        type: string
        default: all
      build:
        description: 'Compile and publish; false only validates integration'
        type: boolean
        default: false

permissions:
  contents: read

env:
  SOURCE_REPO: VIKINGYFY/immortalwrt
  SOURCE_BRANCH: owrt
  WRT_CONFIG: ARM64-OPhub
  WRT_TARGET: armsr
  WRT_IP: 192.168.10.1
  WRT_NAME: OWRT
  WRT_SSID: OWRT
  WRT_WORD: '12345678'
  WRT_MARK: Lemonade-22
  WRT_PACKAGE: ''

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.profiles.outputs.matrix }}
      dtbs: ${{ steps.profiles.outputs.dtbs }}
      packer_commit: ${{ steps.profiles.outputs.packer_commit }}
      uboot_commit: ${{ steps.profiles.outputs.uboot_commit }}
      userspace_commit: ${{ steps.profiles.outputs.userspace_commit }}
      kernel_config_path: ${{ steps.profiles.outputs.kernel_config_path }}
      kernel_config_file: ${{ steps.profiles.outputs.kernel_config_file }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate ARM64 integration
        id: profiles
        uses: ./.github/actions/arm64-ophub-validate
        with:
          device: ${{ inputs.device }}

  kernel:
    if: inputs.build
    needs: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Read kernel build settings
        id: settings
        run: |
          set -euo pipefail
          lock=Custom/ARM64-OPhub/sources.json
          for key in version config_repository config_commit config_path source source_repository source_commit userspace_commit sign; do
            if [[ "$key" == "userspace_commit" ]]; then
              jqpath=".userspace.commit"
            else
              jqpath=".kernel.$key"
            fi
            echo "$key=$(jq -er "$jqpath" "$lock")" >> "$GITHUB_OUTPUT"
          done
      - name: Checkout your kernel configuration
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.settings.outputs.config_repository }}
          ref: ${{ steps.settings.outputs.config_commit }}
          path: kernel-fork
      - name: Checkout pinned userspace SONiC kernel patches
        uses: actions/checkout@v4
        with:
          repository: VIKINGYFY/immortalwrt
          ref: ${{ steps.settings.outputs.userspace_commit }}
          path: sonic-patches
          sparse-checkout: |
            target/linux/generic/hack-6.18/984-add-sonic-fullcone-support.patch
            target/linux/generic/hack-6.18/985-add-sonic-fullcone-to-ipt.patch
            target/linux/generic/hack-6.18/986-add-sonic-fullcone-to-nft.patch
          sparse-checkout-cone-mode: false
      - name: Prepare pinned kernel source and apply SONiC patches
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/arm64-ophub-kernel
          sudo chown "$USER:$USER" /mnt/arm64-ophub-kernel
          mkdir -p kernel-output
          python3 Custom/ARM64-OPhub/prepare_kernel_source.py \
            --patch-root sonic-patches \
            --destination /mnt/arm64-ophub-kernel/compile-kernel/kernel/linux-6.18.y \
            --record kernel-output/source-preparation.json
          df -h /mnt/arm64-ophub-kernel
      - name: Prepare BTF, fake-flow and SONiC kernel configuration
        run: |
          set -euo pipefail
          python3 Custom/ARM64-OPhub/prepare_kernel.py
      - uses: actions/cache@v4
        with:
          path: /mnt/arm64-ophub-kernel/ccache
          key: arm64-ophub-kernel-arm64-gcc-${{ steps.settings.outputs.version }}-${{ hashFiles('kernel-fork/kernel-config/**') }}
          restore-keys: arm64-ophub-kernel-arm64-gcc-${{ steps.settings.outputs.version }}-
      - name: Compile shared ARM64 kernel, modules and DTBs
        uses: ophub/amlogic-s9xxx-armbian@d7ad87797c2c3f60108082b0f84bf315a9fb6b63
        with:
          build_target: kernel
          kernel_source: ${{ steps.settings.outputs.source }}
          kernel_version: ${{ steps.settings.outputs.version }}
          kernel_auto: 'false'
          kernel_package: all
          kernel_toolchain: gcc
          kernel_sign: ${{ steps.settings.outputs.sign }}
          kernel_config: kernel-fork/${{ steps.settings.outputs.config_path }}
          delete_source: 'true'
          docker_hostpath: /mnt/arm64-ophub-kernel
          docker_image: ophub/armbian-noble:arm64
      - name: Validate and record kernel artifact
        env:
          REQUIRED_DTBS: ${{ needs.plan.outputs.dtbs }}
          DEVICE_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          set -euo pipefail
          version=$(jq -r .kernel.version Custom/ARM64-OPhub/sources.json)
          archive="$PACKAGED_OUTPUTPATH/$version.tar.gz"
          test -s "$archive"
          args=(--fakeflow --sonic)
          if jq -e 'any(.include[]; .board == "fine3399")' <<< "$DEVICE_MATRIX" >/dev/null; then
            args+=(--device fine3399)
          fi
          while IFS= read -r dtb; do args+=(--dtb "$dtb"); done < <(jq -r '.[]' <<< "$REQUIRED_DTBS")
          python3 Scripts/Check-DAEDE-Kernel.py "$archive" "${args[@]}"
          mkdir -p kernel-output
          cp "$archive" kernel-output/kernel.tar.gz
          cp kernel-fork/${{ needs.plan.outputs.kernel_config_path }}/${{ needs.plan.outputs.kernel_config_file }} kernel-output/requested-kernel.config
          cp Custom/ARM64-OPhub/sources.json kernel-output/kernel-sources.json
          (cd kernel-output && sha256sum kernel.tar.gz > kernel.sha256)
      - name: Upload compiled kernel
        uses: actions/upload-artifact@v4
        with:
          name: arm64-ophub-kernel
          path: kernel-output/
          if-no-files-found: error
          retention-days: 30

  rootfs:
    if: inputs.build
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      source_hash: ${{ steps.metadata.outputs.source_hash }}
      upstream_ci_hash: ${{ steps.metadata.outputs.upstream_ci_hash }}
      theme: ${{ steps.metadata.outputs.theme }}
    steps:
      - uses: actions/checkout@v4
      - name: Free build space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget swig libelf-dev dos2unix jq
          curl -fsSL --retry 3 https://build-scripts.immortalwrt.org/init_build_environment.sh -o /tmp/immortalwrt-build-env.sh
          sudo bash /tmp/immortalwrt-build-env.sh
      - name: Checkout upstream plugin configuration
        uses: actions/checkout@v4
        with:
          repository: VIKINGYFY/OpenWRT-CI
          ref: main
          path: upstream-ci
      - name: Clone pinned VIKINGYFY userspace source
        run: |
          set -euo pipefail
          lock=Custom/ARM64-OPhub/sources.json
          repo=$(jq -er '.userspace.repository' "$lock")
          branch=$(jq -er '.userspace.branch' "$lock")
          commit=$(jq -er '.userspace.commit' "$lock")
          [[ "https://github.com/$SOURCE_REPO" == "$repo" ]] || { echo "::error::SOURCE_REPO does not match sources.json"; exit 1; }
          [[ "$SOURCE_BRANCH" == "$branch" ]] || { echo "::error::SOURCE_BRANCH does not match sources.json"; exit 1; }
          git init --quiet wrt
          git -C wrt remote add origin "$repo"
          git -C wrt fetch --quiet --depth=1 origin "$commit"
          git -C wrt checkout --quiet --detach FETCH_HEAD
          actual=$(git -C wrt rev-parse HEAD)
          [[ "$actual" == "$commit" ]] || { echo "::error::Userspace checkout does not match the locked commit"; exit 1; }
          echo "SOURCE_HASH=$actual" >> "$GITHUB_ENV"
          echo "WRT_DATE=$(TZ=Asia/Shanghai date +'%y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"
          mkdir -p output
          echo "UPSTREAM_CI_HASH=$(git -C upstream-ci rev-parse HEAD)" >> "$GITHUB_ENV"
          theme=$(sed -nE 's/^[[:space:]]*WRT_THEME:[[:space:]]*([a-zA-Z0-9_-]+)[[:space:]]*$/\1/p' upstream-ci/.github/workflows/OWRT-ALL.yml)
          [[ "$theme" =~ ^[a-zA-Z0-9_-]+$ ]]
          echo "WRT_THEME=$theme" >> "$GITHUB_ENV"
          ln -s "$GITHUB_WORKSPACE/wrt" upstream-ci/wrt
          tar -czf output/upstream-plugin-config.tar.gz -C upstream-ci Config Scripts .github/workflows/OWRT-ALL.yml
      - name: Configure generic ARM64 rootfs with upstream packages
        working-directory: wrt
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          upstream="$GITHUB_WORKSPACE/upstream-ci"
          (export GITHUB_WORKSPACE="$upstream"; bash "$upstream/Scripts/Packages.sh" && bash "$upstream/Scripts/Handles.sh")
          cat "$upstream/Config/GENERAL.txt" > .config
          GITHUB_WORKSPACE="$upstream" bash "$upstream/Scripts/Settings.sh"
          grep -E '^CONFIG_PACKAGE_luci[^=]*=y$' .config | sort -u > "$GITHUB_WORKSPACE/output/upstream-luci-selected.config"
          cat "$GITHUB_WORKSPACE/Config/ARM64-OPhub.txt" >> .config
          # OPhub runtime dependencies shared by every ARM64 device.
          for package in r8152-firmware perl perlbase-essential perlbase-utf8 perlbase-time perlbase-xsloader ethtool uuidgen pv; do
            echo "CONFIG_PACKAGE_${package}=y" >> .config
          done
          bash "$GITHUB_WORKSPACE/Scripts/DAEDE.sh" configure
          bash "$GITHUB_WORKSPACE/Scripts/Fakeflow.sh" configure
          make defconfig
          bash "$GITHUB_WORKSPACE/Scripts/DAEDE.sh" verify
          bash "$GITHUB_WORKSPACE/Scripts/Fakeflow.sh" verify
          test -s tmp/.config-package.in
          python3 "$GITHUB_WORKSPACE/Custom/ARM64-OPhub/verify_packages.py" \
            --requested "$GITHUB_WORKSPACE/output/upstream-luci-selected.config" \
            --actual .config \
            --definitions tmp/.config-package.in \
            --theme "$WRT_THEME"
          lock="$GITHUB_WORKSPACE/Custom/ARM64-OPhub/sources.json"
          grep -qx "$(jq -r .userspace.sonic_package_config "$lock")" .config || {
            echo "::error::SONiC fullcone userspace package was not selected"; exit 1; }
          while IFS= read -r package; do
            if grep -qx "CONFIG_PACKAGE_${package}=y" .config; then
              echo "::error::Legacy fullcone package selected: $package"; exit 1
            fi
          done < <(jq -r '.userspace.sonic_legacy_packages[]' "$lock")
          for package in firewall4 kmod-nft-nat; do
            grep -qx "CONFIG_PACKAGE_${package}=y" .config || {
              echo "::error::Missing firewall/nftables userspace package: $package"; exit 1; }
          done
          grep -qx 'CONFIG_PACKAGE_r8152-firmware=y' .config || {
            echo '::error::Missing RTL8152/RTL8153 firmware package'; exit 1; }
          for package in perl perlbase-essential perlbase-utf8 perlbase-time perlbase-xsloader; do
            grep -qx "CONFIG_PACKAGE_${package}=y" .config || {
              echo "::error::Missing OPhub sysinfo Perl dependency: $package"; exit 1; }
          done
          for package in ethtool uuidgen pv; do
            grep -qx "CONFIG_PACKAGE_${package}=y" .config || {
              echo "::error::Missing OPhub runtime tool: $package"; exit 1; }
          done
          if ! grep -qE '^(CONFIG_DEFAULT_nftables|CONFIG_PACKAGE_nftables-json|CONFIG_PACKAGE_nftables-nojson)=y$' .config; then
            echo "::error::Missing nftables userspace provider (DEFAULT_nftables/nftables-json/nftables-nojson)"
            exit 1
          fi
          grep -qx 'CONFIG_TARGET_armsr=y' .config
          grep -qx 'CONFIG_TARGET_armsr_armv8=y' .config
          grep -qx 'CONFIG_TARGET_ROOTFS_TARGZ=y' .config
          if grep -q '^CONFIG_TARGET_rockchip=y' .config; then
            echo '::error::Expected generic ARM64 rootfs, not native Rockchip firmware'
            exit 1
          fi
          cp .config "$GITHUB_WORKSPACE/output/rootfs-build.config"
          cp tmp/.config-package.in "$GITHUB_WORKSPACE/output/package-definitions.config"
      - name: Build generic rootfs
        working-directory: wrt
        run: |
          set -euo pipefail
          make download -j"$(nproc)"
          make -j"$(nproc)" || make -j1 V=s
          mapfile -t roots < <(find bin/targets/armsr/armv8 -maxdepth 1 -name '*-generic-rootfs.tar.gz' -type f)
          if [ "${#roots[@]}" -eq 0 ]; then
            mapfile -t roots < <(find bin/targets/armsr/armv8 -maxdepth 1 -name '*-generic-targz-rootfs.tar.gz' -type f)
          fi
          test "${#roots[@]}" -eq 1
          tar -tzf "${roots[0]}" > "$GITHUB_WORKSPACE/output/rootfs-contents.txt"
          grep -Eq '^(\./)?etc/openwrt_release$' "$GITHUB_WORKSPACE/output/rootfs-contents.txt"
          grep -Eq '^(\./)?(usr/)?lib/firmware/rtl_nic/rtl8153b-2\.fw$' "$GITHUB_WORKSPACE/output/rootfs-contents.txt" || {
            echo '::error::Rootfs is missing rtl_nic/rtl8153b-2.fw'; exit 1; }
          grep -Eq '^(\./)?usr/bin/perl$' "$GITHUB_WORKSPACE/output/rootfs-contents.txt" || {
            echo '::error::Rootfs is missing the Perl interpreter required by cpustat'; exit 1; }
          for module in strict utf8 Time/HiRes XSLoader; do
            grep -Eq "^(\./)?usr/lib/perl5/[^/]+/${module}\.pm$" "$GITHUB_WORKSPACE/output/rootfs-contents.txt" || {
              echo "::error::Rootfs is missing Perl module: $module"; exit 1; }
          done
          cp "${roots[0]}" "$GITHUB_WORKSPACE/output/immortalwrt-armsr-armv8-generic-rootfs.tar.gz"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/output/immortalwrt-commit.txt"
          for feed in feeds/*; do
            if [ -d "$feed/.git" ]; then printf '%s %s\n' "$feed" "$(git -C "$feed" rev-parse HEAD)"; fi
          done > "$GITHUB_WORKSPACE/output/feed-commits.txt"
      - name: Export rootfs metadata
        id: metadata
        run: |
          echo "source_hash=$SOURCE_HASH" >> "$GITHUB_OUTPUT"
          echo "upstream_ci_hash=$UPSTREAM_CI_HASH" >> "$GITHUB_OUTPUT"
          echo "theme=$WRT_THEME" >> "$GITHUB_OUTPUT"
          (cd output && sha256sum *rootfs.tar.gz > rootfs.sha256)
      - name: Upload shared rootfs and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-ophub-rootfs
          path: output/
          if-no-files-found: error
          retention-days: 30

  package:
    if: inputs.build
    needs: [plan, kernel, rootfs]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: Package ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      OPHUB_COMMIT: ${{ needs.plan.outputs.packer_commit }}
      SOURCE_HASH: ${{ needs.rootfs.outputs.source_hash }}
      UPSTREAM_CI_HASH: ${{ needs.rootfs.outputs.upstream_ci_hash }}
      WRT_THEME: ${{ needs.rootfs.outputs.theme }}
      BOARD: ${{ matrix.board }}
      BOARD_DTB: ${{ matrix.dtb }}
      BOARD_BOOTLOADER: ${{ matrix.bootloader }}
      BOARD_UBOOT: ${{ matrix.uboot }}
      BOARD_TRUST: ${{ matrix.trust }}
      PARTITION_SIZE: ${{ matrix.partition_size }}
      RELEASE_PREFIX: ${{ matrix.release_prefix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ophub/amlogic-s9xxx-openwrt
          ref: ${{ env.OPHUB_COMMIT }}
          path: ophub
      - name: Download kernel compiled in this run
        uses: actions/download-artifact@v4
        with:
          name: arm64-ophub-kernel
          path: compiled-kernel
      - name: Download shared rootfs
        uses: actions/download-artifact@v4
        with:
          name: arm64-ophub-rootfs
          path: output
      - name: Prepare pinned ophub packer and kernel
        run: |
          set -euo pipefail
          python3 Custom/ARM64-OPhub/pin_ophub.py ophub/remake
          bash -n ophub/remake
          sudo apt-get update
          sudo xargs -r apt-get install -y < ophub/make-openwrt/scripts/ubuntu2404-make-openwrt-depends
          lock=Custom/ARM64-OPhub/sources.json
          (cd output && sha256sum -c rootfs.sha256)
          (cd compiled-kernel && sha256sum -c kernel.sha256)
          cp compiled-kernel/kernel.tar.gz kernel.tar.gz
          cp compiled-kernel/kernel.sha256 output/kernel.sha256
          cp compiled-kernel/requested-kernel.config output/requested-kernel.config
          mkdir -p ophub/make-openwrt/kernel/stable ophub/openwrt-armsr
          python3 Scripts/Check-DAEDE-Kernel.py kernel.tar.gz --dtb "$BOARD_DTB" --fakeflow --sonic --device "$BOARD"
          tar -xzf kernel.tar.gz -C ophub/make-openwrt/kernel/stable
          kernel=$(python3 Custom/ARM64-OPhub/stage_kernel.py ophub/make-openwrt/kernel/stable)
          echo "Actual compiled kernel: $kernel (requested $(jq -r .kernel.version "$lock"))"
          cp output/*-generic-rootfs.tar.gz ophub/openwrt-armsr/
          cp "$lock" output/ophub-sources.json
          if [ "$BOARD" = fine3399 ]; then
            fine_rootfs="ophub/make-openwrt/openwrt-files/different-files/fine3399/rootfs"
            mkdir -p "$fine_rootfs/etc/uci-defaults"
            install -m 0755 Custom/ARM64-OPhub/fine3399-direct-lan \
              "$fine_rootfs/etc/uci-defaults/99-fine3399-direct-lan"
          fi
          echo "KERNEL_VERSION=$kernel" >> "$GITHUB_ENV"
      - name: Assemble device using ophub hardware support
        working-directory: ophub
        run: |
          set -euo pipefail
          sudo ./remake -b "$BOARD" -r Lemonade-22/ophub-kernel -u stable -k "$KERNEL_VERSION" -a false -s "$PARTITION_SIZE" -p "$WRT_IP" -n Lemonade-22
          mapfile -t images < <(find openwrt/out -maxdepth 1 -name "*${BOARD}*.img.gz" -type f)
          test "${#images[@]}" -eq 1
          gzip -t "${images[0]}"
          cp "${images[0]}" "$GITHUB_WORKSPACE/output/"
          files=("make-openwrt/u-boot/rockchip/$BOARD/$BOARD_BOOTLOADER" "make-openwrt/u-boot/rockchip/$BOARD/$BOARD_UBOOT")
          if [ "$BOARD_TRUST" != NA ]; then files+=("make-openwrt/u-boot/rockchip/$BOARD/$BOARD_TRUST"); fi
          sha256sum "${files[@]}" > "$GITHUB_WORKSPACE/output/bootloader-sha256sums.txt"
      - name: Record build provenance
        run: |
          set -euo pipefail
          printf 'CI_COMMIT=%s\nSOURCE_REPO=%s\nSOURCE_COMMIT=%s\nOPHUB_COMMIT=%s\nKERNEL=%s\n' "$GITHUB_SHA" "$SOURCE_REPO" "$SOURCE_HASH" "$OPHUB_COMMIT" "$KERNEL_VERSION" > output/build-info.txt
          printf 'UPSTREAM_CI_REPO=VIKINGYFY/OpenWRT-CI\nUPSTREAM_CI_COMMIT=%s\nWRT_THEME=%s\n' "$UPSTREAM_CI_HASH" "$WRT_THEME" >> output/build-info.txt
          printf 'BOARD=%s\nDTB=%s\nPARTITION_SIZE=%s\n' "$BOARD" "$BOARD_DTB" "$PARTITION_SIZE" >> output/build-info.txt
          cp Custom/ARM64-OPhub/devices.json output/device-profiles.json
          WRT_LIST=$(sed -nE 's/^CONFIG_PACKAGE_(luci-(app|theme)[^=_]*)=y$/\1/p' output/rootfs-build.config | sort -u | tr '\n' ' ')
          echo "WRT_LIST=$WRT_LIST" >> "$GITHUB_ENV"
          (cd output && sha256sum *.img.gz *rootfs.tar.gz > SHA256SUMS)
          echo "RELEASE_TAG=${RELEASE_PREFIX}-$(date -u +'%Y.%m.%d-%H.%M.%S')" >> "$GITHUB_ENV"
      - name: Upload build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARM64-OPhub-${{ matrix.board }}-${{ github.run_id }}
          path: output/
          if-no-files-found: error
      - name: Release Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: false
          files: output/*
          body: |
            源码：https://github.com/${{ env.SOURCE_REPO }}.git
            分支：${{ env.SOURCE_BRANCH }}
            提交：${{ env.SOURCE_HASH }}

            配置：${{ matrix.name }}
            平台：ARM64 / ${{ matrix.soc }}（armsr/armv8 用户空间）

            登录地址：${{ env.WRT_IP }}

            内核版本：${{ env.KERNEL_VERSION }}
            插件列表：${{ env.WRT_LIST }}
