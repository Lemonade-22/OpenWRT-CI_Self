# SPDX-License-Identifier: MIT
# Based on MTK-ALL.yml.
name: MT7621
run-name: MT7621 · ${{ inputs.DEVICE || 'ALL' }} · ${{ inputs.TEST && '仅输出配置' || '完整编译' }}

on:
  workflow_dispatch:
    inputs:
      DEVICE:
        description: '编译设备（ALL 编译以下三台设备）'
        type: choice
        required: true
        default: ALL
        options:
          - ALL
          - xiaomi-R3G
          - XY-C5
          - JDCloud-RE-SP-01B
      PACKAGE:
        description: '手动调整插件包，多个请用换行符分隔。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

permissions: write-all

jobs:
  build:
    uses: ./.github/workflows/WRT-CORE-SELF.yml
    with:
      WRT_CONFIG: ${{ fromJSON('{"ALL":"mt7621","xiaomi-R3G":"Xiaomi-Mi-Router-3G","XY-C5":"XY-C5-OWRT-WIFI-NO","JDCloud-RE-SP-01B":"JDCloud-RE-SP-01B"}')[inputs.DEVICE || 'ALL'] }}
      # Use Footstrap for both ALL and individual device builds.
      WRT_THEME: footstrap
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: owrt
      WRT_SOURCE: VIKINGYFY/immortalwrt
      # Applied after GENERAL.txt and profile overrides by Settings.sh.
      WRT_PACKAGE: |
        ${{inputs.PACKAGE}}
        CONFIG_PACKAGE_luci-app-gecoosac=n
        CONFIG_PACKAGE_luci-app-homeproxy=n
        CONFIG_PACKAGE_luci-app-wolultra=n
        CONFIG_PACKAGE_luci-app-samba4=n
        CONFIG_PACKAGE_luci-i18n-samba4-zh-cn=n
        CONFIG_PACKAGE_samba4-server=n
        CONFIG_PACKAGE_samba4-libs=n
        CONFIG_PACKAGE_samba4-client=n
        CONFIG_PACKAGE_samba4-admin=n
        CONFIG_PACKAGE_samba4-utils=n
        CONFIG_PACKAGE_luci-theme-aurora=n
        CONFIG_PACKAGE_luci-app-aurora-config=n
        CONFIG_PACKAGE_luci-i18n-aurora-config-zh-cn=n
        CONFIG_PACKAGE_luci-theme-footstrap=y
      WRT_TEST: ${{inputs.TEST || false}}
