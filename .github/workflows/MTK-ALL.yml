# MTK ALL
name: MTK ALL

on:
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用换行符分隔。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

permissions: write-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [MEDIATEK-WIFI-YES, MEDIATEK-WIFI-NO]
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      CONFIG: ${{ matrix.CONFIG }}
      PACKAGE: ${{ inputs.PACKAGE }}
      TEST: ${{ inputs.TEST }}
