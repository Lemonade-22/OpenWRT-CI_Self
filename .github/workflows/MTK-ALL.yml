# N60 Pro 512M 专用 CI
name: N60 Pro 512M UBI-506M

on:
  # 手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用换行符分隔。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

permissions: write-all

jobs:
  build:
    name: N60 Pro 512M UBI-506M
    uses: ./.github/workflows/N60-Pro-512m.yml
    with:
      PACKAGE: ${{ inputs.PACKAGE }}
      TEST: ${{ inputs.TEST }}
