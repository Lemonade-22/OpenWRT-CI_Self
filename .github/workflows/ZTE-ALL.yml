# SPDX-License-Identifier: MIT
# ZTE 设备构建入口（当前：SR1010 / 星云MAX）。
# 底树 = VIKINGYFY/immortalwrt @ owrt（6.18 内核、owrt 系统层）；
# 设备层由 Scripts/Device-Hooks/<CONFIG>.sh 在 prepare 阶段从 cnjn/immortalwrt 注入；
# 内核走 cnjn 的 6.18 fork（外部内核树，ZX279133 支持原生在树内）。

name: ZTE-ALL

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'ZTE device (all builds every registered ZTE device)'
        type: choice
        options:
          - all
          - sr1010
        default: all
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

permissions: write-all

concurrency:
  group: zte-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 下拉选择 → 矩阵展开：新设备加进 case 里一行即可
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.map.outputs.matrix }}
    steps:
      - id: map
        run: |
          case "${{ inputs.device }}" in
            sr1010|all)
              echo 'matrix={"include":[{"CONFIG":"ZTE-SR1010","SOURCE":"VIKINGYFY/immortalwrt","BRANCH":"owrt"}]}' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unknown device ${{ inputs.device }}" >&2
              exit 1
              ;;
          esac

  config:
    name: ${{matrix.CONFIG}}
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}

    #调用公用编译核心WRT-CORE-SELF.yml
    uses: ./.github/workflows/WRT-CORE-SELF.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题（footstrap，随官方 luci feed）
      WRT_THEME: footstrap
      #默认主机名
      WRT_NAME: OWRT
      #默认WIFI名称
      WRT_SSID: OWRT
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
