name: N60 Pro 512m Core

on:
  workflow_call:
    inputs:
      PACKAGE:
        required: false
        type: string
      TEST:
        required: false
        type: boolean

permissions: write-all

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  WRT_THEME: aurora
  WRT_NAME: N60-Pro
  WRT_SSID: N60-Pro
  WRT_WORD: 12345678
  WRT_IP: 192.168.10.1
  WRT_PW: 无
  WRT_REPO: https://github.com/Lemonade-22/immortalwrt.git
  WRT_BRANCH: main
  WRT_SOURCE: Lemonade-22/immortalwrt
  WRT_PACKAGE: ${{ inputs.PACKAGE || '' }}
  WRT_TEST: ${{ inputs.TEST || false }}

jobs:
  build:
    name: N60 Pro 512m WIFI-NO + WIFI-YES
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./wrt/
          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Check Caches
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@main
        with:
          key: N60-Pro-512M-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: N60-Pro-512M-${{env.WRT_INFO}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done
            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build
            echo "toolchain cache prepared"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/
          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Build WIFI-NO and WIFI-YES
        if: env.WRT_TEST != 'true'
        shell: bash
        run: |
          set -e
          cd ./wrt
          for CFG in N60-Pro-512M-WIFI-NO N60-Pro-512M-WIFI-YES; do
            echo "========================================"
            echo "Building $CFG"
            echo "========================================"

            rm -f .config
            if [[ "$CFG" == *"test"* ]]; then
              cat "$GITHUB_WORKSPACE/Config/$CFG.txt" > .config
            else
              cat "$GITHUB_WORKSPACE/Config/$CFG.txt" "$GITHUB_WORKSPACE/Config/GENERAL.txt" > .config
            fi

            export WRT_CONFIG="$CFG"
            export WRT_TARGET="$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' "$GITHUB_WORKSPACE/Config/$CFG.txt")"
            export WRT_WIFI="wifi-yes"
            if [[ "${CFG,,}" == *"wifi"* && "${CFG,,}" == *"no"* ]]; then
              export WRT_WIFI="wifi-no"
            fi
            export WRT_DATE="$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            export WRT_MARK="${GITHUB_REPOSITORY%%/*}"
            export WRT_INFO="${WRT_SOURCE%%/*}"
            export WRT_PACKAGE="${{ inputs.PACKAGE || '' }}"

            "$GITHUB_WORKSPACE/Scripts/Settings.sh"
            make defconfig -j$(nproc)
            make clean -j$(nproc)
            make download -j$(nproc)
            make -j$(nproc) || make -j1 V=s

            mkdir -p ./upload
            cp -f ./.config "./upload/Config-${CFG}-${WRT_INFO}-${WRT_BRANCH}-${WRT_DATE}.txt"
            export WRT_KVER="$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \; | head -1)"
            export WRT_LIST="$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')"

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +
            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*"); do
              EXT=$(basename "$FILE" | cut -d '.' -f 2-)
              NAME=$(basename "$FILE" | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="${NAME}-${WRT_INFO}-${WRT_BRANCH}-${WRT_WIFI}-${WRT_DATE}.${EXT}"
              mv -f "$FILE" "./upload/$NEW_FILE"
            done
            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            TAG="${CFG}-${WRT_INFO}-${WRT_BRANCH}-${WRT_DATE}"
            gh release create "$TAG" ./upload/*.* --title "$TAG" --notes "源码：$WRT_REPO\n分支：$WRT_BRANCH\n提交：$WRT_HASH\n配置：$CFG\n平台：$WRT_TARGET\n登录地址：$WRT_IP\n登录密码：$WRT_PW\nWIFI名称：$WRT_SSID\nWIFI密码：$WRT_WORD\n内核版本：$WRT_KVER\n插件列表：$WRT_LIST"

            rm -rf ./upload
            make clean -j$(nproc)
          done

      - name: Output Configuration Files
        if: env.WRT_TEST == 'true'
        run: |
          cd ./wrt
          for CFG in N60-Pro-512M-WIFI-NO N60-Pro-512M-WIFI-YES; do
            cat "$GITHUB_WORKSPACE/Config/$CFG.txt" "$GITHUB_WORKSPACE/Config/GENERAL.txt" > "/tmp/$CFG.config"
            echo "Generated /tmp/$CFG.config"
          done
