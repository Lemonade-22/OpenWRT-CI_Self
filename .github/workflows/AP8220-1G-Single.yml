# SPDX-License-Identifier: MIT
# AP8220 1 GiB NAND —— 单分区（NAND 整片一个 rootfs）变体。
#
# 与 AP8220-1G.yml 的区别：
#   · 不再写死 QWRT(1000 MiB) / ubi_kernel(24 MiB)，内核 DTB 回到上游 qcom,smem-part
#   · 分区由 MIBIB 决定，刷机前 MIBIB 必须已是单分区版本
#   · 同时产出 factory.ubi（uboot 可直刷）和 sysupgrade.bin（系统内升级）
name: AP8220-1G-Single rootfs
run-name: 编译单分区固件 · ${{ inputs.TEST && '仅输出配置' || '完整编译' }}

on:
  # 手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用换行符分隔。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [IPQ807X-AP8220-1G-SINGLE-WIFI-NO]
        SOURCE: [VIKINGYFY/immortalwrt]
    uses: ./.github/workflows/WRT-CORE-SELF.yml
    with:
      #编译配置
      WRT_CONFIG: ${{ matrix.CONFIG }}
      #默认主题
      WRT_THEME: aurora
      #默认主机名
      WRT_NAME: OWRT
      #默认WIFI名称
      WRT_SSID: OWRT
      #默认WIFI密码
      WRT_WORD: '12345678'
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{ matrix.SOURCE }}.git
      #源码分支：单分区补丁只跟踪 owrt
      WRT_BRANCH: owrt
      #源码名称
      WRT_SOURCE: ${{ matrix.SOURCE }}
      #插件调整
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      #仅输出配置文件
      WRT_TEST: ${{ inputs.TEST || false }}
