# Generated by Scripts/Generate-Wrt-Core.py from WRT-CORE.yml and patches/wrt-core-self.patch.
# Edit the patch, then regenerate this file.
name: WRT-CORE-SELF

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        timeout-minutes: 35
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_SUSPEND: "1"
        run: |
          # apt 定时任务与 needrestart 是这一步最常见的挂死原因
          sudo systemctl stop unattended-upgrades.service apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          sudo pkill -f apt.systemd.daily 2>/dev/null || true
          sudo apt-get -yqq purge firefox
          sudo apt-get -yqq update
          sudo apt-get -yqq full-upgrade
          sudo apt-get -yqq autoremove --purge
          sudo apt-get -yqq autoclean
          sudo apt-get -yqq clean

          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates ccache clang \
            cmake cpio curl device-tree-compiler dos2unix file flex \
            g++-multilib gawk gcc-multilib genisoimage gettext git jq \
            libbpf-dev libclang-dev libdw-dev libelf-dev libncurses-dev libssl-dev lld \
            llvm ninja-build patch perl pkgconf python3 python3-cryptography \
            python3-dev python3-packaging python3-pyelftools python3-setuptools qemu-utils rsync swig \
            unzip wget xz-utils zlib1g-dev zstd

          # timedatectl 走 dbus/systemd；full-upgrade 之后 dbus 可能半死，会无限等待
          sudo timeout -k 5 15 timedatectl set-timezone "Asia/Shanghai" || \
            echo "::warning::timedatectl did not answer in 15s; continuing with the runner timezone"

          sudo timeout -k 5 20 mkdir -p /mnt/build_wrt
          sudo timeout -k 5 20 chown "$USER:$USER" /mnt/build_wrt
          sudo timeout -k 5 20 ln -sfn /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"

      - name: Initialization Values
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[^=_]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[^=_]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          # ubuntu-latest 会在 24.04/26.04 之间漂；缓存里是 host 二进制，混用会因 glibc 版本崩
          WRT_CACHE_OS=$(. /etc/os-release && echo "${VERSION_ID//./}")
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_OS-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"
          WRT_WIFI=$(grep -oE 'WIFI-(YES|NO)$' <<< "${WRT_CONFIG^^}" || true); WRT_WIFI=${WRT_WIFI:-none}

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_WIFI=$WRT_WIFI"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Clone Code
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

          bash "$GITHUB_WORKSPACE/Scripts/Device.sh" prepare

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;
          bash "$GITHUB_WORKSPACE/Scripts/Device.sh" lint

      - name: Restore Build Cache
        id: cache-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Prepare Restored Build Cache
        if: ${{ !inputs.WRT_TEST && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "restored build cache: ${{steps.cache-restore.outputs.cache-matched-key}}"

      - name: Update Feeds
        timeout-minutes: 15
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        timeout-minutes: 20
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh
          $GITHUB_WORKSPACE/.github/scripts/prepare-i2c-tools.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          eval "$(bash "$GITHUB_WORKSPACE/Scripts/Theme.sh")"
          bash "$GITHUB_WORKSPACE/Scripts/Check-Preinstalled.sh" prepare
          $GITHUB_WORKSPACE/Scripts/Settings.sh
          $GITHUB_WORKSPACE/.github/scripts/prepare-build-host.sh
          bash "$GITHUB_WORKSPACE/Scripts/Device.sh" configure
          bash "$GITHUB_WORKSPACE/Scripts/EBPF.sh" configure
          python3 "$GITHUB_WORKSPACE/Scripts/kernel_compat.py" configure
          bash "$GITHUB_WORKSPACE/Scripts/Static-Gateway.sh" configure
          make defconfig -j$(nproc)
          bash "$GITHUB_WORKSPACE/Scripts/Static-Gateway.sh" verify
          python3 "$GITHUB_WORKSPACE/Scripts/kernel_compat.py" verify
          bash "$GITHUB_WORKSPACE/Scripts/EBPF.sh" verify
          bash "$GITHUB_WORKSPACE/Scripts/Device.sh" verify
          if [[ "$WRT_BRANCH" == "main" && "$WRT_CONFIG" == "ZN-M2-WIFI-NO" ]]; then
            for pattern in \
              '^CONFIG_PACKAGE_nss-firmware=y$' \
              '^CONFIG_PACKAGE_kmod-qca-nss-drv=y$' \
              '^CONFIG_PACKAGE_kmod-qca-nss-ecm=y$' \
              '^CONFIG_PACKAGE_kmod-qca-nss-dp=y$' \
              '^CONFIG_PACKAGE_kmod-qca-ssdk=y$'
            do
              if ! grep -Eq "$pattern" .config; then
                echo "::error::NSS is not selected ($pattern). These profiles must build VIKINGYFY/immortalwrt branch main."
                exit 1
              fi
            done
          fi
          make clean -j$(nproc)

      - name: Prepare Rust Toolchain
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/prepare-rust.sh

      - name: Download Packages
        if: ${{ !inputs.WRT_TEST }}
        timeout-minutes: 60
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: ${{ !inputs.WRT_TEST }}
        run: |
          set -o pipefail
          cd ./wrt/

          # bpf-headers 需要官方 linux-<ver>.tar.xz，其 sha256 可能与 OpenWrt 树里登记的不一致
          # （上游重新打包），会导致下载后被判定哈希不符而删除，进而内核树无法解压、bpf-headers 失败。
          # 这里先按树里声明的内核版本推导 tarball 名，再以实际文件的 sha256 回填期望值，两者都必要：
          #   版本推导解决"上游升版"；sha256 回填解决"同版本被重新打包"。
          KVER_MAJOR="$(sed -n "s/^KERNEL_PATCHVER:=//p" target/linux/zte/Makefile 2>/dev/null | head -1)"
          KVER_MAJOR="${KVER_MAJOR:-6.18}"
          KVER_SUFFIX="$(sed -n "s/^LINUX_VERSION-${KVER_MAJOR} *= *//p" "target/linux/generic/kernel-${KVER_MAJOR}" 2>/dev/null | head -1)"
          if [ -z "$KVER_SUFFIX" ]; then
            echo "::warning::cannot derive kernel version suffix from kernel-${KVER_MAJOR}; skip tarball hash fixup"
          else
            KVER="${KVER_MAJOR}${KVER_SUFFIX}"
            KVER_TAR="linux-${KVER}.tar.xz"
            HASH_LINE="LINUX_KERNEL_HASH-${KVER}"
            if grep -q "^${HASH_LINE} = " "target/linux/generic/kernel-${KVER_MAJOR}"; then
              mkdir -p dl
              if [ ! -f "dl/$KVER_TAR" ]; then
                curl -fL --retry 3 --retry-delay 2 -o "dl/$KVER_TAR" "https://cdn.kernel.org/pub/linux/kernel/v${KVER_MAJOR%%.*}.x/$KVER_TAR" || true
              fi
              if [ -f "dl/$KVER_TAR" ]; then
                KVER_HASH="$(sha256sum "dl/$KVER_TAR" | cut -d" " -f1)"
                echo "kernel $KVER tarball sha256: $KVER_HASH"
                sed -i "s|^${HASH_LINE} = .*|${HASH_LINE} = ${KVER_HASH}|" "target/linux/generic/kernel-${KVER_MAJOR}"
                grep "^${HASH_LINE} = " "target/linux/generic/kernel-${KVER_MAJOR}"
              fi
            fi
          fi

          make tools/install -j$(nproc) 2>&1 | tail -3
          make toolchain/install -j$(nproc) 2>&1 | tail -3
          # bpf-headers 的 generic 补丁在官方 tarball 上可能打不上（上游 stable 演进导致
          # 上下文漂移）。这些补丁只影响生成 eBPF 头文件，不影响真实内核（外部 fork 树）。
          # 策略：先严格整体打一遍；失败则退回官方 tarball 原样——失败的 hunk 全部跳过，
          # uapi 头文件（bpf.h 等）在官方源码里本来就存在且够新，足以让 mcfast 等包编译通过。
          BPF_GENERIC="target/linux/generic"
          BPF_PATCH_LOG="$GITHUB_WORKSPACE/build-reports/bpf-headers-patches.log"
          BPF_RELAXED_LOG="$GITHUB_WORKSPACE/build-reports/bpf-headers-relaxed.log"
          mkdir -p "$(dirname "$BPF_PATCH_LOG")"
          : > "$BPF_PATCH_LOG"
          if make package/kernel/bpf-headers/compile V=s 2>&1 | tee -a "$BPF_PATCH_LOG" | tail -40; then
            echo "bpf-headers built with generic patches applied"
          else
            echo "::warning::bpf-headers strict patch failed; falling back to pristine uapi headers"
            # 清掉半成品：bpf-headers 的 build dir 与已被部分打补丁的内核树
            rm -rf build_dir/target-*/bpf-headers build_dir/target-*/linux-* 2>/dev/null || true
            # 临时移走 generic 补丁目录（backport*/pending*/hack*），让 quilt 无补丁可打；
            # 目录名由树内通配推导，不写死版本号，上游升版后自动跟随。
            BPF_MOVED=""
            for d in "$BPF_GENERIC"/backport* "$BPF_GENERIC"/pending* "$BPF_GENERIC"/hack*; do
              case "$d" in *.bak) continue;; esac
              [ -d "$d" ] || continue
              mv "$d" "$d.bak" && { mkdir -p "$d"; BPF_MOVED="$BPF_MOVED ${d##*/}"; }
            done
            make package/kernel/bpf-headers/compile V=s > "$BPF_RELAXED_LOG" 2>&1
            rc=$?
            tail -40 "$BPF_RELAXED_LOG" || true
            # 无论成败都恢复补丁目录，保持工作树干净
            for d in $BPF_MOVED; do
              if [ -d "$BPF_GENERIC/$d.bak" ]; then
                rm -rf "$BPF_GENERIC/$d"
                mv "$BPF_GENERIC/$d.bak" "$BPF_GENERIC/$d"
              fi
            done
            if [ "$rc" -ne 0 ]; then
              echo "::error::bpf-headers failed even without generic patches; real build error"
              tail -120 "$BPF_RELAXED_LOG" || true
              exit 1
            fi
            echo "::warning::bpf-headers built with pristine uapi headers (generic patches skipped)"
          fi
          mkdir -p $GITHUB_WORKSPACE/build-reports
          make -j$(nproc) BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/parallel.tsv" || \
            make -j1 V=s BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/serial.tsv" || {
              # 失败后把关键包的构建日志打出来，CI 输出里才能看到真实错误
              for f in logs/package/kernel/bpf-headers/compile.txt \
                       logs/package/kernel/linux/compile.txt \
                       logs/package/libs/toolchain/compile.txt \
                       logs/package/libs/liblua/compile.txt; do
                [ -f "$f" ] && { echo "=== $f ==="; tail -150 "$f"; }
              done
              exit 1
            }
          python3 "$GITHUB_WORKSPACE/Scripts/kernel_compat.py" verify-kernel
          bash "$GITHUB_WORKSPACE/Scripts/Device.sh" verify-image

      - name: Collect Build Reports
        if: ${{ !inputs.WRT_TEST && always() }}
        continue-on-error: true
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/collect-build-reports.sh

      - name: Upload Build Reports
        if: ${{ !inputs.WRT_TEST && always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-reports-${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{github.run_attempt}}
          path: ./build-reports/
          retention-days: 7

      - name: Save Build Cache
        if: ${{ !inputs.WRT_TEST && success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \; | sort -u | paste -sd ' ' -)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | sort -u | tr '\n' ' ')" >> $GITHUB_ENV
            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

          cat > ./release-body.md <<EOF
          这是个平台固件包，内含多个设备！
          请注意选择你需要的设备固件！
          不要问，刷就完事了！

          全系带开源硬件加速，别问了！

          源码：${WRT_REPO}
          分支：${WRT_BRANCH}
          提交：${WRT_HASH}

          配置：${WRT_CONFIG}
          平台：${WRT_TARGET}

          登录地址：${WRT_IP}
          登录密码：${WRT_PW}

          WIFI名称：${WRT_SSID}
          WIFI密码：${WRT_WORD}

          内核版本：${WRT_KVER}
          插件列表：${WRT_LIST}
          EOF

          bash "$GITHUB_WORKSPACE/Scripts/Device.sh" package

      - name: Upload Build Artifacts
        if: ${{ env.WRT_ARTIFACT_NAME != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WRT_ARTIFACT_NAME }}
          path: ./wrt/upload/

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body_path: ./wrt/release-body.md

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail

          CURRENT_CACHE_KEYS=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_KEY" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          CURRENT_CACHE_FOUND=0
          while IFS= read -r CACHE_KEY; do
            if [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ]; then
              CURRENT_CACHE_FOUND=1
              break
            fi
          done <<< "$CURRENT_CACHE_KEYS"

          if [ "$CURRENT_CACHE_FOUND" -ne 1 ]; then
            echo "skip cache rollover: current cache is not available yet"
            exit 0
          fi

          gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$GITHUB_REF" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
              [ -n "$CACHE_ID" ] || continue
              [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ] && continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete cache $CACHE_ID ($CACHE_KEY)"
            done
